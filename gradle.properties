org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
kotlin.code.style=official

# Published coordinates: GROUP:POM_ARTIFACT_ID:VERSION_NAME = app.honk-honk:honk:0.4.0.
# VERSION_NAME is the only place the version lives: Honk.VERSION (and so the User-Agent) is
# generated from it at build time, and the release workflow checks it against the git tag.
# GROUP, POM_ARTIFACT_ID and the GitHub links below are written by the monorepo's
# sdk/scripts/sync-release-config.sh from sdk/release.env; change them there.
GROUP=app.honk-honk
POM_ARTIFACT_ID=honk
VERSION_NAME=0.4.0

POM_NAME=Honk
POM_DESCRIPTION=Official Kotlin/Java client for Honk (honk-honk.app): send events from apps, scripts and automations to your phone, with retries and idempotency built in.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/honk-hq/kotlin
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/license/mit
POM_SCM_URL=https://github.com/honk-hq/kotlin
POM_SCM_CONNECTION=scm:git:https://github.com/honk-hq/kotlin.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/honk-hq/kotlin.git
POM_DEVELOPER_ID=honk-hq
POM_DEVELOPER_NAME=Honk
POM_DEVELOPER_URL=https://github.com/honk-hq
